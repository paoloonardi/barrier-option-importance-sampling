[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "barrier-is"
version = "1.0.0"
description = "Up-and-in put pricing with Monte Carlo and two-phase importance sampling"
authors = [{ name = "Paolo Nardi" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
